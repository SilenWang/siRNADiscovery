[workspace]
channels = ["conda-forge"]
name = "siRNADiscovery_env"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
train-siRNA = "python siRNADiscovery.py"
train-mRNA = "python siRNADiscovery.py"

[dependencies]
python = ">=3.9,<3.11"
numpy = ">=1.24,<2"
pandas = ">=2.0"
scikit-learn = ">=1.3"
scipy = ">=1.11"
biopython = ">=1.81"
matplotlib = ">=3.7"
cudatoolkit = ">=11.8"
cudnn = ">=8.6,<9"

[pypi-dependencies]
stellargraph = ">=1.2"
tensorflow = ">=2.12,<2.16"
chardet = "*"
