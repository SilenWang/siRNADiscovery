[workspace]
channels = ["conda-forge"]
name = "siRNADiscovery_env"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.1"

[system-requirements]
cuda = "12"

[tasks]
train-siRNA = { cmd = "python siRNADiscovery.py", cwd = "siRNA_split/" }
train-mRNA = { cmd = "python siRNADiscovery.py", cwd = "mRNA_split/" }

[dependencies]
python = "3.11.*"
pandas = "*"
numpy = "*"
scikit-learn = "*"
scipy = "*"
tensorflow = { version = "2.15.*", channel = "conda-forge" }
biopython = ">=1.81"
matplotlib = ">=3.7"

[target.linux-64.dependencies]
cudnn = "*"

[pypi-dependencies]
stellargraph = "*"
chardet = "*"
